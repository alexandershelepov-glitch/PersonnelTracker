name: Build Windows portable

# Manual runs are the primary scenario. GitHub only registers
# workflow_dispatch once the workflow exists on the default branch, so a
# narrowly scoped push trigger builds the first artifact from this feature
# branch before it reaches main. It reacts only to Windows build inputs and
# never fires for main or unrelated branches.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-standalone
    paths:
      - "runtime_paths.py"
      - "PersonnelTracker-windows.spec"
      - "requirements.txt"
      - "requirements-build.txt"
      - "app.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 portable (onedir)
    runs-on: windows-latest
    env:
      # GitHub runners have no interactive desktop; the whole suite and the
      # packaged smoke run use the Qt offscreen platform.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build portable onedir bundle
        run: python -m PyInstaller --noconfirm --clean PersonnelTracker-windows.spec

      - name: Verify bundle and runtime data location
        shell: pwsh
        run: |
          $appDir = "dist\PersonnelTracker"
          $app = Join-Path $appDir "PersonnelTracker.exe"
          if (-not (Test-Path $app)) { throw "PersonnelTracker.exe not found at $app" }
          if (-not (Test-Path (Join-Path $appDir "_internal"))) { throw "PyInstaller _internal folder is missing" }

          # Fresh state: the frozen app must create %LOCALAPPDATA%\PersonnelTracker\data.
          $localRoot = Join-Path $env:LOCALAPPDATA "PersonnelTracker"
          $localData = Join-Path $localRoot "data"
          if (Test-Path $localRoot) { Remove-Item -Recurse -Force $localRoot }

          $process = Start-Process -FilePath $app -PassThru
          $db = Join-Path $localData "personnel.db"
          for ($attempt = 0; $attempt -lt 60 -and -not (Test-Path $db); $attempt++) {
            Start-Sleep -Seconds 1
            if ($process.HasExited) { break }
          }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

          if (-not (Test-Path $db)) { throw "Frozen application did not create $db" }
          if (Test-Path (Join-Path $appDir "data")) { throw "Frozen application wrote user data inside the program folder" }
          Write-Host "Runtime data location verified: $db"

      - name: Package ZIP
        shell: pwsh
        run: |
          $zip = "PersonnelTracker-v1.1.0-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path dist\PersonnelTracker -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonnelTracker-v1.1.0-Windows-x64
          path: PersonnelTracker-v1.1.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
